services:
  mysql:
    image: mysql:8.4
    container_name: teamforge_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teamforge_ai}
      MYSQL_USER: ${MYSQL_USER:-teamforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-teamforge}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamforge_api
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-teamforge}:${MYSQL_PASSWORD:-teamforge}@mysql:3306/${MYSQL_DATABASE:-teamforge_ai}
    command: >
      sh -c "python -c 'from app import create_app; from app.extensions import db; app=create_app(); ctx=app.app_context(); ctx.push(); db.create_all()'
      && gunicorn --bind 0.0.0.0:5000 run:app"
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
